<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sismonow — Terremotos en tiempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Rejilla cyberpunk de fondo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* Resplandor morado en las esquinas */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 255, 0.10), transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* ===== HEADER ===== */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px 10px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #00ffff, #b026ff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(176, 38, 255, 0.9)); }
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #00ffff;
            text-transform: uppercase;
            margin-top: 6px;
            opacity: 0.8;
        }

        /* ===== BUSCADOR CENTRAL ===== */
        .search-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            margin: 30px auto 20px;
            max-width: 700px;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            width: 100%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #00ffff;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .search-box input {
            flex: 1;
            padding: 18px 24px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .search-box input::placeholder {
            color: rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .search-box button {
            padding: 0 30px;
            border: none;
            background: linear-gradient(90deg, #00ffff, #b026ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .search-box button:hover {
            background: linear-gradient(90deg, #b026ff, #ff00ff);
            color: #fff;
            letter-spacing: 4px;
        }

        /* ===== INFO / CONTADOR ===== */
        .info-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 10, 20, 0.5);
            backdrop-filter: blur(8px);
            min-width: 180px;
        }

        .info-item .label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .info-item .value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            margin-top: 4px;
        }

        /* ===== GLOBO ===== */
        #globeViz {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 65vh;
            margin: 0 auto;
        }

        /* ===== LEYENDA DE COLORES ===== */
        .legend {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .logo { font-size: 2rem; letter-spacing: 4px; }
            .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
            .search-box input { padding: 14px 16px; font-size: 0.95rem; }
            .search-box button { padding: 0 18px; letter-spacing: 2px; font-size: 0.75rem; }
            .info-item { min-width: 140px; padding: 8px 16px; }
            .info-item .value { font-size: 1.2rem; }
            #globeViz { height: 55vh; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SISMONOW</div>
        <div class="subtitle">Global Earthquake Monitor · Live</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="BUSCAR PAÍS · EJ: VENEZUELA" />
            <button onclick="buscarPais()">BUSCAR</button>
        </div>
    </div>

    <div class="info-bar">
        <div class="info-item">
            <span class="label">Terremotos 24h</span>
            <span class="value" id="quakeCount">—</span>
        </div>
        <div class="info-item">
            <span class="label">Última actualización</span>
            <span class="value" id="lastUpdate">—</span>
        </div>
        <div class="info-item">
            <span class="label">Ubicación activa</span>
            <span class="value" id="activeLocation" style="font-size:1rem;">Mundo</span>
        </div>
    </div>

    <div id="globeViz"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:#ffe600; color:#ffe600;"></div>
            Magnitud &lt; 3.0
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#ff8c00; color:#ff8c00;"></div>
            Magnitud 3.0 – 4.9
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#ff0033; color:#ff0033;"></div>
            Magnitud ≥ 5.0
        </div>
    </div>

    <script src="//cdn.jsdelivr.net/npm/globe.gl"></script>
    <script>
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('rgba(0,0,0,0)')
            .width(document.getElementById('globeViz').clientWidth)
            .height(document.getElementById('globeViz').clientHeight)
            .atmosphereColor('#00ffff')
            .atmosphereAltitude(0.18);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';

        function cargarTerremotos() {
            fetch(USGS_URL)
                .then(r => r.json())
                .then(data => {
                    const quakes = data.features;
                    const ahora = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

                    document.getElementById('quakeCount').innerText = quakes.length;
                    document.getElementById('lastUpdate').innerText = ahora;

                    const points = quakes.map(q => ({
                        lat: q.geometry.coordinates[1],
                        lng: q.geometry.coordinates[0],
                        mag: q.properties.mag,
                        place: q.properties.place,
                        size: Math.max(0.25, q.properties.mag * 0.25),
                        color: q.properties.mag >= 5 ? '#ff0033'
                             : q.properties.mag >= 3 ? '#ff8c00'
                             : '#ffe600'
                    }));

                    world
                        .pointsData(points)
                        .pointLat('lat')
                        .pointLng('lng')
                        .pointColor('color')
                        .pointRadius('size')
                        .pointAltitude(0.02)
                        .pointResolution(24)
                        .pointLabel(d => `<b>Mag ${d.mag}</b><br/>${d.place}`);
                })
                .catch(err => {
                    document.getElementById('quakeCount').innerText = 'Error';
                    console.error(err);
                });
        }

        cargarTerremotos();
        setInterval(cargarTerremotos, 300000);

        // --- BUSCADOR ---
        function buscarPais() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);

            document.getElementById('activeLocation').innerText = 'Buscando...';

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) {
                        document.getElementById('activeLocation').innerText = 'No encontrado';
                        world.ringsData([]);
                        return;
                    }
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);

                    world.controls().autoRotate = false;
                    world.pointOfView({ lat: lat, lng: lng, altitude: 1.2 }, 2000);

                    world
                        .ringsData([{ lat: lat, lng: lng }])
                        .ringLat('lat')
                        .ringLng('lng')
                        .ringColor(() => t => `rgba(0, 255, 255, ${1 - t})`)
                        .ringMaxRadius(8)
                        .ringPropagationSpeed(3)
                        .ringRepeatPeriod(800);

                    const nombreCorto = data[0].display_name.split(',')[0];
                    document.getElementById('activeLocation').innerText = nombreCorto;
                })
                .catch(err => {
                    document.getElementById('activeLocation').innerText = 'Error';
                    console.error(err);
                });
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') buscarPais();
        });

        // Redibujar globo cuando cambia el tamaño de la ventana
        window.addEventListener('resize', () => {
            const el = document.getElementById('globeViz');
            world.width(el.clientWidth).height(el.clientHeight);
        });
    </script>
</body>
</html>
