<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sismonow - Real-time Earthquakes</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: Arial; }
        #globeViz { width: 100vw; height: 100vh; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 400px;
        }
        #search {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 8px;
        }
        #search input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 14px;
            width: 250px;
            outline: none;
        }
        #search input:focus { border-color: #ff2d2d; }
        #search button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #ff2d2d;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        #search button:hover { background: #ff5555; }
    </style>
</head>
<body>
    <div id="info">Cargando terremotos...</div>
    <div id="search">
        <input type="text" id="searchInput" placeholder="Buscar país (ej: Venezuela)" />
        <button onclick="buscarPais()">Buscar</button>
    </div>
    <div id="globeViz"></div>

    <script src="//cdn.jsdelivr.net/npm/globe.gl"></script>
    <script>
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('#000000')
            .width(window.innerWidth)
            .height(window.innerHeight);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';

        function cargarTerremotos() {
            fetch(USGS_URL)
                .then(r => r.json())
                .then(data => {
                    const quakes = data.features;
                    const ahora = new Date().toLocaleTimeString();
                    document.getElementById('info').innerText =
                        '🌍 ' + quakes.length + ' terremotos activos · Actualizado: ' + ahora;

                    const points = quakes.map(q => ({
                        lat: q.geometry.coordinates[1],
                        lng: q.geometry.coordinates[0],
                        mag: q.properties.mag,
                        place: q.properties.place,
                        size: Math.max(0.25, q.properties.mag * 0.25),
                        color: q.properties.mag >= 5 ? '#ff0033'
                             : q.properties.mag >= 3 ? '#ff8c00'
                             : '#ffe600'
                    }));

                    world
                        .pointsData(points)
                        .pointLat('lat')
                        .pointLng('lng')
                        .pointColor('color')
                        .pointRadius('size')
                        .pointAltitude(0.02)
                        .pointResolution(24)
                        .pointLabel(d => `<b>Mag ${d.mag}</b><br/>${d.place}`);
                })
                .catch(err => {
                    document.getElementById('info').innerText = 'Error: ' + err;
                });
        }

        cargarTerremotos();
        setInterval(cargarTerremotos, 300000);

        // --- BUSCADOR POR PAÍS CON ANILLO PULSANTE ---
        function buscarPais() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);

            document.getElementById('info').innerText = '🔎 Buscando ' + query + '...';

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    if (data.length === 0) {
                        document.getElementById('info').innerText = '❌ No se encontró: ' + query;
                        world.ringsData([]);
                        return;
                    }
                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);

                    world.controls().autoRotate = false;
                    world.pointOfView({ lat: lat, lng: lng, altitude: 1.2 }, 2000);

                    // Anillo pulsante en el país buscado
                    world
                        .ringsData([{ lat: lat, lng: lng }])
                        .ringLat('lat')
                        .ringLng('lng')
                        .ringColor(() => t => `rgba(255, 45, 45, ${1 - t})`)
                        .ringMaxRadius(8)
                        .ringPropagationSpeed(3)
                        .ringRepeatPeriod(800);

                    document.getElementById('info').innerText =
                        '📍 ' + data[0].display_name +
                        ' · Coordenadas: ' + lat.toFixed(2) + ', ' + lng.toFixed(2);
                })
                .catch(err => {
                    document.getElementById('info').innerText = 'Error: ' + err;
                });
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') buscarPais();
        });
    </script>
</body>
</html>
