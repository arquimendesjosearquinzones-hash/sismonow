<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="google" content="notranslate">
    <meta name="theme-color" content="#05050a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="sismonow">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src https://fonts.gstatic.com; img-src 'self' https://unpkg.com https://server.arcgisonline.com data:; connect-src https://earthquake.usgs.gov https://nominatim.openstreetmap.org;">

    <title>sismonow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overscroll-behavior: none; }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 255, 0.10), transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        /* ===== PARTÍCULAS CYBERPUNK ===== */
        #particles-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* ===== BANNER TSUNAMI ===== */
        #tsunamiBanner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10000;
            background: linear-gradient(90deg, #ff0000, #cc0000, #ff0000);
            color: #fff;
            padding: 12px 20px;
            padding-top: calc(12px + env(safe-area-inset-top));
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 0.9rem;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
            display: none;
            align-items: center;
            gap: 12px;
            animation: tsunamiPulse 1.5s ease-in-out infinite;
        }
        #tsunamiBanner.visible { display: flex; }
        @keyframes tsunamiPulse {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 0, 0, 0.7); }
            50% { box-shadow: 0 0 60px rgba(255, 0, 0, 1); }
        }
        #tsunamiBanner .tsunami-text {
            flex: 1;
            text-align: center;
            cursor: pointer;
        }
        #tsunamiBanner .tsunami-text:hover { text-decoration: underline; }
        #tsunamiBanner .tsunami-close {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #fff;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        #tsunamiBanner .tsunami-close:hover {
            background: #000;
            transform: scale(1.15);
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 26px 20px 6px;
        }
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #00ffff, #b026ff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(176, 38, 255, 0.9)); }
        }

        .subtitle {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #00ffff;
            text-transform: uppercase;
            margin-top: 4px;
            opacity: 0.8;
        }

        .lang-switch {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 20;
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            max-width: 280px;
            justify-content: flex-end;
        }
        .lang-switch button {
            padding: 4px 7px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 5px;
            background: rgba(0, 10, 20, 0.7);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .lang-switch button:hover, .lang-switch button.active {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.7);
        }

        .search-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px auto 12px;
            max-width: 1000px;
            padding: 0 16px;
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            flex: 1;
            min-width: 240px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.05);
            overflow: hidden;
        }
        .search-box:focus-within {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        }
        .search-box input {
            flex: 1;
            padding: 16px 20px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
        }
        .search-box input::placeholder { color: rgba(0, 255, 255, 0.5); }
        .search-box button {
            padding: 0 22px;
            border: none;
            background: linear-gradient(90deg, #00ffff, #b026ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .search-box button:hover {
            background: linear-gradient(90deg, #b026ff, #ff00ff);
            color: #fff;
        }
        .action-button {
            padding: 16px 18px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-button:hover { background: rgba(0, 255, 255, 0.15); }
        .action-button:disabled { opacity: 0.6; cursor: wait; }
        .action-button.success { border-color: #00ff88; color: #00ff88; }
        .news-button { border-color: rgba(255, 0, 255, 0.5); color: #ff00ff; }

        .filters-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 0 auto 12px;
            max-width: 900px;
            padding: 0 16px;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(0, 10, 20, 0.6);
            backdrop-filter: blur(8px);
        }
        .filter-group label {
            font-size: 0.68rem;
            letter-spacing: 1px;
            color: rgba(0, 255, 255, 0.75);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .filter-group select {
            background: rgba(0, 10, 20, 0.9);
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 6px;
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            padding: 5px 8px;
            cursor: pointer;
            outline: none;
        }
        .filter-group select option { background: #05050a; color: #00ffff; }

        .info-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 0 16px;
        }
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 10, 20, 0.5);
            backdrop-filter: blur(8px);
            min-width: 150px;
        }
        .info-item .label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
        }
        .info-item .value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            margin-top: 4px;
        }

        #globeViz {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 60vh;
            margin: 0 auto;
        }

        #recentPanel {
            position: fixed;
            top: 180px;
            left: 16px;
            z-index: 9998;
            width: 300px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(20, 0, 30, 0.98), rgba(10, 0, 20, 0.98));
            border: 2px solid #b026ff;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(176, 38, 255, 0.5), inset 0 0 30px rgba(176, 38, 255, 0.05);
            padding: 14px;
            transition: transform 0.3s ease;
        }
        #recentPanel .recent-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #b026ff;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(176, 38, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .recent-item {
            padding: 9px 6px;
            border-bottom: 1px dashed rgba(176, 38, 255, 0.15);
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 6px;
        }
        .recent-item:hover, .recent-item:active {
            background: rgba(176, 38, 255, 0.15);
            transform: translateX(4px);
        }
        .recent-item:last-child { border-bottom: none; }
        .recent-mag {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 0.95rem;
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .recent-mag.mag-high { background: #ff0033; color: #fff; }
        .recent-mag.mag-mid { background: #ff8c00; color: #000; }
        .recent-mag.mag-low { background: #ffe600; color: #000; }
        .recent-place {
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.85);
            display: inline;
        }
        .recent-time {
            font-size: 0.68rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
            letter-spacing: 1px;
        }
        .recent-tsunami {
            font-size: 0.6rem;
            color: #ff0000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            margin-left: 5px;
        }
        .recent-go {
            float: right;
            color: #b026ff;
            font-size: 0.9rem;
            opacity: 0.6;
        }
        .recent-item:hover .recent-go { opacity: 1; }

        #localPanel {
            position: fixed;
            top: 220px;
            right: 16px;
            z-index: 9999;
            width: 320px;
            max-width: calc(100vw - 32px);
            max-height: calc(100vh - 260px);
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(0, 20, 30, 0.98), rgba(0, 10, 20, 0.98));
            border: 2px solid #00ff88;
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.5);
            padding: 18px;
            display: none;
        }
        #localPanel.visible { display: block; }
        #localPanel .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: #00ff88;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #localPanel .panel-loc {
            font-size: 0.95rem;
            color: #fff;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
        }
        #localPanel .panel-close {
            background: none;
            border: none;
            color: #00ff88;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 6px;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px dashed rgba(0, 255, 255, 0.15);
            font-size: 0.88rem;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: rgba(255, 255, 255, 0.7); letter-spacing: 1px; }
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #00ffff;
            font-size: 0.95rem;
        }
        .stat-value.warn { color: #ff8c00; }
        .stat-value.danger { color: #ff0033; }
        .panel-actions {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 255, 136, 0.2);
            display: flex;
            gap: 8px;
        }
        .panel-actions button {
            flex: 1;
            padding: 9px;
            border: 1px solid rgba(255, 0, 255, 0.5);
            border-radius: 8px;
            background: rgba(255, 0, 255, 0.08);
            color: #ff00ff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.68rem;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .emergency-section {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px solid rgba(255, 45, 45, 0.5);
        }
        .emergency-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #ff2d2d;
            margin-bottom: 10px;
        }
        .emergency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            font-size: 0.88rem;
            border-bottom: 1px dashed rgba(255, 45, 45, 0.15);
        }
        .emergency-item:last-child { border-bottom: none; }
        .emergency-item .number {
            font-family: 'Orbitron', sans-serif;
            color: #ff2d2d;
            font-weight: 700;
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid rgba(255, 45, 45, 0.4);
            border-radius: 6px;
        }

        #satModal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        #satModal.visible { display: flex; }
        #satModal .modal-content {
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            background: linear-gradient(135deg, rgba(0, 20, 30, 0.98), rgba(0, 10, 20, 0.98));
            border: 2px solid #00ffff;
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #satModal .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        #satModal .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #00ffff;
            flex: 1;
        }
        #satModal .modal-close {
            background: none;
            border: 2px solid rgba(0, 255, 255, 0.4);
            border-radius: 8px;
            color: #00ffff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 12px;
            line-height: 1;
        }
        #satModal .modal-info {
            padding: 14px 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            font-size: 0.85rem;
        }
        #satModal .modal-info-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #satModal .modal-info-item .lbl {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
        }
        #satModal .modal-info-item .val {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #fff;
        }
        #satMap {
            flex: 1;
            min-height: 400px;
            width: 100%;
            background: #000;
        }
        #satModal .modal-actions {
            padding: 14px 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(0, 255, 255, 0.15);
        }
        #satModal .modal-actions a,
        #satModal .modal-actions button {
            flex: 1;
            min-width: 140px;
            padding: 12px 16px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            background: rgba(0, 255, 255, 0.08);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .mobile-tabs {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 9997;
            background: rgba(0, 10, 20, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 255, 255, 0.3);
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
            gap: 6px;
            justify-content: space-around;
        }
        .mobile-tabs button {
            flex: 1;
            padding: 8px 4px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 255, 255, 0.05);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .legend {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 16px;
            margin-top: 10px;
            margin-bottom: 60px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 900px) {
            header { padding: 18px 16px 4px; }
            .logo { font-size: 2.2rem; letter-spacing: 4px; }
            .subtitle { font-size: 0.7rem; letter-spacing: 2px; }
            .lang-switch {
                position: relative;
                top: auto;
                right: auto;
                justify-content: center;
                margin: 10px auto 0;
                max-width: 100%;
            }
            .search-container { padding: 0 12px; gap: 6px; }
            .search-box { min-width: 100%; }
            .search-box input { padding: 13px 14px; font-size: 0.9rem; }
            .search-box button { padding: 0 14px; font-size: 0.7rem; }
            .action-button { padding: 13px 14px; font-size: 0.7rem; flex: 1; }
            .filters-bar { padding: 0 12px; gap: 6px; }
            .filter-group { flex: 1; padding: 6px 10px; }
            .filter-group label { font-size: 0.55rem; }
            .filter-group select { font-size: 0.7rem; padding: 4px 6px; }
            .info-bar { gap: 8px; padding: 0 12px; }
            .info-item { min-width: 0; flex: 1; padding: 8px 10px; }
            .info-item .label { font-size: 0.55rem; }
            .info-item .value { font-size: 1rem; }
            #globeViz { height: 55vh; }
            #recentPanel {
                top: auto;
                bottom: 70px;
                left: 12px;
                right: 12px;
                width: auto;
                max-height: 32vh;
                z-index: 9000;
            }
            #recentPanel.collapsed {
                max-height: 48px;
                overflow: hidden;
            }

        function distanciaKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

        function calcularCirculo(lat, lng, radioKm, puntos) {
            puntos = puntos || 96;
            const coords = [];
            const R = 6371;
            const dist = radioKm / R;
            const lat1 = lat * Math.PI / 180;
            const lng1 = lng * Math.PI / 180;
            for (let i = 0; i <= puntos; i++) {
                const bearing = (i / puntos) * 2 * Math.PI;
                const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dist) + Math.cos(lat1) * Math.sin(dist) * Math.cos(bearing));

            }
            return coords;

            const filtrados = ultimosTerremotos.filter(q => q.mag >= currentMagFilter);
            world
                .pointsData(filtrados)
                .pointLat('lat').pointLng('lng').pointColor('color')
                .pointRadius('size').pointAltitude(0.02).pointResolution(24)
                .pointLabel(d => '<b>' + escapeHTML(t.mag) + ' ' + escapeHTML(d.mag) + '</b><br/>' + escapeHTML(d.place));
        }

        function cargarTerremotos() {
            const t = I18N[currentLang];
            fetch(USGS_URL, { referrerPolicy: 'no-referrer' })
                .then(r => { if (!r.ok) throw new Error('USGS ' + r.status); return r.json(); })
                .then(data => {
                    if (!data || !Array.isArray(data.features)) throw new Error('Formato inesperado');
                    const quakes = data.features;
                    const ahora = new Date().toLocaleTimeString(t.locale, { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('quakeCount').textContent = quakes.length;
                    document.getElementById('lastUpdate').textContent = ahora;

                    ultimosTerremotos = quakes
                        .filter(q => q && q.geometry && Array.isArray(q.geometry.coordinates) && q.geometry.coordinates.length >= 2)
                        .map(q => {
                            const mag = (typeof q.properties?.mag === 'number') ? q.properties.mag : 0;
                            return {
                                lat: q.geometry.coordinates[1],
                                lng: q.geometry.coordinates[0],
                                depth: q.geometry.coordinates[2] || 0,
                                mag: mag,
                                place: q.properties?.place || t.unknownPlace,
                                url: q.properties?.url || '',
                                time: q.properties?.time || 0,
                                tsunami: q.properties?.tsunami === 1,
                                size: Math.max(0.25, mag * 0.25),
                                color: mag >= 5 ? '#ff0033' : mag >= 3 ? '#ff8c00' : '#ffe600'
                            };
                        });

                    redibujarPuntos();
                    dibujarUltimosSismos();
                    verificarTsunami();
                    if (miUbicacion) actualizarPanelLocal();
                })
                .catch(err => {
                    console.error('Error terremotos:', err);
                    document.getElementById('quakeCount').textContent = t.error;
                });
        }

        function dibujarUltimosSismos() {
            const t = I18N[currentLang];
            const ultimos = [...ultimosTerremotos].sort((a, b) => b.time - a.time).slice(0, 5);
            const list = document.getElementById('recentList');

            if (ultimos.length === 0) {
                list.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:0.85rem;">—</div>';
                return;
            }

            list.innerHTML = ultimos.map((q, i) => {
                const cls = q.mag >= 5 ? 'mag-high' : q.mag >= 3 ? 'mag-mid' : 'mag-low';
                const ts = q.tsunami ? '<span class="recent-tsunami">🌊</span>' : '';
                return '<div class="recent-item" data-idx="' + i + '">' +
                    '<span class="recent-go">▶</span>' +
                    '<span class="recent-mag ' + cls + '">M' + q.mag.toFixed(1) + '</span>' +
                    '<span class="recent-place">' + escapeHTML(q.place.substring(0, 50)) + '</span>' + ts +
                    '<div class="recent-time">' + tiempoRelativo(q.time, t) + '</div>' +
                    '</div>';
            }).join('');

            list.querySelectorAll('.recent-item').forEach((el, i) => {
                el.addEventListener('click', () => {
                    const q = ultimos[i];
                    volarA(q.lat, q.lng);
                    setTimeout(() => abrirModalSismo(q), 1200);
                });
            });
        }

        function toggleRecent() {
            const p = document.getElementById('recentPanel');
            p.classList.toggle('collapsed');
            document.getElementById('recentToggle').textContent = p.classList.contains('collapsed') ? '▸' : '▾';
        }

        function verificarTsunami() {
            const dismissed = localStorage.getItem('tsunami_dismissed');
            if (dismissed && (Date.now() - parseInt(dismissed, 10)) < 3600000) return;
            const conTsunami = ultimosTerremotos.filter(q => q.tsunami);
            const banner = document.getElementById('tsunamiBanner');
            if (conTsunami.length > 0) {
                const fuerte = conTsunami.reduce((max, q) => q.mag > max.mag ? q : max, conTsunami[0]);
                banner.dataset.lat = fuerte.lat;
                banner.dataset.lng = fuerte.lng;
                banner.dataset.idx = ultimosTerremotos.indexOf(fuerte);
                banner.classList.add('visible');
            } else {
                banner.classList.remove('visible');
            }
        }

        function cerrarBannerTsunami(e) {
            e.stopPropagation();
            document.getElementById('tsunamiBanner').classList.remove('visible');
            localStorage.setItem('tsunami_dismissed', Date.now());
        }

        function abrirTsunami() {
            const banner = document.getElementById('tsunamiBanner');
            const lat = parseFloat(banner.dataset.lat);
            const lng = parseFloat(banner.dataset.lng);
            const idx = parseInt(banner.dataset.idx, 10);
            if (isNaN(lat) || isNaN(lng)) return;
            volarA(lat, lng);
            const q = ultimosTerremotos[idx];
            if (q) setTimeout(() => abrirModalSismo(q), 1200);
        }

        function abrirModalSismo(q) {
            const t = I18N[currentLang];
            const modal = document.getElementById('satModal');
            document.getElementById('satTitle').textContent = '📍 ' + t.modalDetails;

            const fecha = new Date(q.time).toLocaleString(t.locale, { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });

            document.getElementById('satInfo').innerHTML =
                '<div class="modal-info-item"><span class="lbl">' + escapeHTML(t.modalMag) + '</span><span class="val">M' + q.mag.toFixed(1) + '</span></div>' +
                '<div class="modal-info-item"><span class="lbl">' + escapeHTML(t.modalDepth) + '</span><span class="val">' + q.depth.toFixed(1) + ' km</span></div>' +
                '<div class="modal-info-item"><span class="lbl">' + escapeHTML(t.modalTime) + '</span><span class="val">' + escapeHTML(fecha) + '</span></div>' +
                '<div class="modal-info-item" style="flex:1;min-width:200px;"><span class="lbl">' + escapeHTML(t.modalPlace) + '</span><span class="val" style="font-size:0.8rem;font-family:Rajdhani;">' + escapeHTML(q.place) + '</span></div>';

            document.getElementById('satUSGS').href = q.url || '#';
            document.getElementById('satMaps').href = 'https://www.google.com/maps?q=' + q.lat + ',' + q.lng + '&z=8&t=k';

            modal.classList.add('visible');

            setTimeout(() => {
                if (!leafletMap) {
                    leafletMap = L.map('satMap', { zoomControl: true, attributionControl: false }).setView([q.lat, q.lng], 8);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, minZoom: 1 }).addTo(leafletMap);
                    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18, opacity: 0.7 }).addTo(leafletMap);
                } else {
                    leafletMap.setView([q.lat, q.lng], 8);
                }

                if (leafletMarker) leafletMap.removeLayer(leafletMarker);

                const icon = L.divIcon({
                    className: '',
                    html: '<div style="width:36px;height:36px;border-radius:50%;background:' + q.color + ';border:3px solid #fff;box-shadow:0 0 25px ' + q.color + ';display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-weight:900;color:#000;font-size:0.7rem;">M' + q.mag.toFixed(1) + '</div>',
                    iconSize: [36, 36], iconAnchor: [18, 18]
                });
                leafletMarker = L.marker([q.lat, q.lng], { icon: icon }).addTo(leafletMap);

                L.circle([q.lat, q.lng], {
                    radius: Math.max(5000, q.mag * 15000),
                    color: q.color, fillColor: q.color,
                    fillOpacity: 0.15, weight: 2, dashArray: '5,10'
                }).addTo(leafletMap);

                leafletMap.invalidateSize();
            }, 100);
        }

        function cerrarModal() { document.getElementById('satModal').classList.remove('visible'); }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
        document.getElementById('satModal').addEventListener('click', e => { if (e.target.id === 'satModal') cerrarModal(); });

        function buscarPais() {
            const t = I18N[currentLang];
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;
            const query = rawQuery.replace(/[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ\s,\-\.]/g, '');
            if (query.length === 0 || query.length > 100) return;
            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=' + currentLang + '&q=' + encodeURIComponent(query);
            const locEl = document.getElementById('activeLocation');
            locEl.dataset.translatable = 'false';
            locEl.textContent = t.searching;
            fetch(url, { referrerPolicy: 'no-referrer' })
                .then(r => { if (!r.ok) throw new Error('Nominatim ' + r.status); return r.json(); })
                .then(data => {
                    if (!Array.isArray(data) || data.length === 0) {
                        locEl.textContent = t.notFound; world.ringsData([]); return;
                    }
                    const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
                    if (isNaN(lat) || isNaN(lng)) { locEl.textContent = t.error; return; }
                    volarA(lat, lng);
                    locEl.textContent = (data[0].display_name || '').split(',')[0].trim() || t.world;
                })
                .catch(err => { console.error(err); locEl.textContent = t.error; });
        }
        document.getElementById('searchInput').addEventListener('keypress', e => { if (e.key === 'Enter') buscarPais(); });

        function volarA(lat, lng) {
            world.controls().autoRotate = false;
            world.pointOfView({ lat: lat, lng: lng, altitude: 1.2 }, 2000);
            world
                .ringsData([{ lat: lat, lng: lng }])
                .ringLat('lat').ringLng('lng')
                .ringColor(() => t2 => 'rgba(0, 255, 255, ' + (1 - t2) + ')')
                .ringMaxRadius(8).ringPropagationSpeed(3).ringRepeatPeriod(800);
        }

        function dibujarCirculoRadio() {
            if (!miUbicacion) { world.pathsData([]); return; }
            const circle = calcularCirculo(miUbicacion.lat, miUbicacion.lng, currentRadiusKm, 96);
            world
                .pathsData([{ points: circle, color: 'rgba(0, 255, 136, 0.9)' }])
                .pathPoints('points')
                .pathPointLat(p => p[0]).pathPointLng(p => p[1])
                .pathColor('color').pathStroke(1.5)
                .pathDashLength(0.02).pathDashGap(0.005).pathDashAnimateTime(8000);
        }

        function abrirNoticias() {
            const loc = document.getElementById('activeLocation').textContent || 'World';
            window.open('https://news.google.com/search?q=' + encodeURIComponent(loc + ' earthquake'), '_blank', 'noopener,noreferrer');
        }

        function usarMiUbicacion() {
            const t = I18N[currentLang];
            const geoBtn = document.getElementById('btn-geo');
            const locEl = document.getElementById('activeLocation');
            if (!navigator.geolocation) { locEl.dataset.translatable='false'; locEl.textContent = t.geoUnsupported; return; }
            geoBtn.disabled = true;
            geoBtn.textContent = t.geoBtnLoading;
            geoBtn.classList.remove('success');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    volarA(lat, lng);
                    miUbicacion = { lat, lng, country: '' };
                    dibujarCirculoRadio();
                    locEl.dataset.translatable = 'false';
                    locEl.textContent = lat.toFixed(2) + ', ' + lng.toFixed(2);
                    document.getElementById('panelLoc').textContent = lat.toFixed(2) + ', ' + lng.toFixed(2);
                    actualizarPanelLocal();
                    abrirPanel();
                    const url = 'https://nominatim.openstreetmap.org/reverse?format=json&limit=1&accept-language=' + currentLang + '&lat=' + lat + '&lon=' + lng;
                    fetch(url, { referrerPolicy: 'no-referrer' }).then(r => r.json()).then(data => {
                        const lugar = data?.address?.city || data?.address?.town || data?.address?.state || data?.address?.country || (lat.toFixed(2) + ', ' + lng.toFixed(2));
                        miUbicacion.country = data?.address?.country || '';
                        locEl.textContent = lugar;
                        document.getElementById('panelLoc').textContent = lugar;
                        actualizarPanelLocal();
                    }).catch(()=>{}).finally(() => {
                        geoBtn.disabled = false;
                        geoBtn.classList.add('success');
                        geoBtn.textContent = t.geoBtnSuccess;
                    });
                },
                (err) => {
                    console.error(err);
                    locEl.dataset.translatable = 'false';
                    locEl.textContent = t.geoDenied;
                    geoBtn.disabled = false;
                    geoBtn.textContent = t.geoBtn;
                },
                { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
            );
        }

        function abrirPanel() { document.getElementById('localPanel').classList.add('visible'); }
        function cerrarPanel() { document.getElementById('localPanel').classList.remove('visible'); }

        function actualizarPanelLocal() {
            if (!miUbicacion) return;
            const t = I18N[currentLang];
            const { lat, lng } = miUbicacion;
            const cercanos = ultimosTerremotos
                .map(q => ({ ...q, dist: distanciaKm(lat, lng, q.lat, q.lng) }))
                .filter(q => q.dist <= currentRadiusKm)
                .sort((a, b) => a.dist - b.dist);

            document.getElementById('statNear').textContent = cercanos.length;

            if (cercanos.length === 0) {
                document.getElementById('statClosest').textContent = t.none;
                document.getElementById('statClosest').className = 'stat-value';
                document.getElementById('statStrongest').textContent = t.none;
                document.getElementById('statStrongest').className = 'stat-value';
            } else {
                const masCercano = cercanos[0];
                document.getElementById('statClosest').textContent = Math.round(masCercano.dist) + ' ' + t.km + ' · M' + masCercano.mag.toFixed(1);
                document.getElementById('statClosest').className = 'stat-value' + (masCercano.mag >= 5 ? ' danger' : masCercano.mag >= 3 ? ' warn' : '');
                const masFuerte = cercanos.reduce((max, q) => q.mag > max.mag ? q : max, cercanos[0]);
                document.getElementById('statStrongest').textContent = 'M' + masFuerte.mag.toFixed(1);
                document.getElementById('statStrongest').className = 'stat-value' + (masFuerte.mag >= 5 ? ' danger' : masFuerte.mag >= 3 ? ' warn' : '');
            }

            const pais = miUbicacion.country;
            const emergencySection = document.getElementById('emergencySection');
            const emergencyList = document.getElementById('emergencyList');
            if (pais && EMERGENCY[pais]) {
                emergencyList.innerHTML = EMERGENCY[pais].map(e => {
                    const nombre = e.name[currentLang] || e.name.en || e.name.es || '';
                    return '<div class="emergency-item"><span>' + escapeHTML(nombre) + '</span><a class="number" href="tel:' + escapeHTML(e.number) + '">' + escapeHTML(e.number) + '</a></div>';
                }).join('');
                emergencySection.style.display = 'block';
            } else {
                emergencySection.style.display = 'none';
            }
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        document.getElementById('magFilter').addEventListener('change', (e) => {
            currentMagFilter = parseFloat(e.target.value) || 0;
            redibujarPuntos();
        });
        document.getElementById('radiusFilter').addEventListener('change', (e) => {
            currentRadiusKm = parseInt(e.target.value, 10) || 500;
            dibujarCirculoRadio();
            if (miUbicacion) actualizarPanelLocal();
        });
        window.addEventListener('resize', () => {
            world.width(globeEl.clientWidth).height(globeEl.clientHeight);
            if (leafletMap) leafletMap.invalidateSize();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW:', err));
            });
        }

        aplicarIdioma(currentLang);
        document.getElementById('activeLocation').dataset.translatable = 'true';
        cargarTerremotos();
        setInterval(cargarTerremotos, 300000);
    </script>
</body>
</html>
