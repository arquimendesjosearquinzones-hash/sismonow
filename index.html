        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 255, 0.10), transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px 10px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #00ffff, #b026ff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(176, 38, 255, 0.9)); }
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #00ffff;
            text-transform: uppercase;
            margin-top: 6px;
            opacity: 0.8;
        }

        .lang-switch {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .lang-switch button {
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 6px;
            background: rgba(0, 10, 20, 0.7);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-switch button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .lang-switch button.active {
            background: #00ffff;
            color: #000;
        }

        .search-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 30px auto 20px;
            max-width: 900px;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            flex: 1;
            min-width: 300px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6), inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .search-box input {
            flex: 1;
            padding: 18px 24px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .search-box input::placeholder {
            color: rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .search-box button {
            padding: 0 30px;
            border: none;
            background: linear-gradient(90deg, #00ffff, #b026ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .search-box button:hover {
            background: linear-gradient(90deg, #b026ff, #ff00ff);
            color: #fff;
            letter-spacing: 4px;
        }

        .geo-button {
            padding: 18px 24px;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .geo-button:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .geo-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .geo-button.success {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .info-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 10, 20, 0.5);
            backdrop-filter: blur(8px);
            min-width: 180px;
        }

        .info-item .label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .info-item .value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            margin-top: 4px;
        }

        #globeViz {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 65vh;
            margin: 0 auto;
        }

        /* ============================================ */
        /* PANEL LOCAL — SIMPLIFICADO Y ROBUSTO        */
        /* ============================================ */
        #localPanel {
            position: fixed;
            top: 200px;
            right: 20px;
            z-index: 9999;
            width: 340px;
            max-width: calc(100vw - 40px);
            max-height: calc(100vh - 240px);
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(0, 20, 30, 0.98), rgba(0, 10, 20, 0.98));
            border: 2px solid #00ff88;
            border-radius: 14px;
            box-shadow:
                0 0 40px rgba(0, 255, 136, 0.5),
                0 0 80px rgba(0, 255, 136, 0.2),
                inset 0 0 30px rgba(0, 255, 136, 0.05);
            padding: 20px;
            display: none;
        }

        #localPanel.visible {
            display: block;
        }

        #localPanel .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 2px;
            color: #00ff88;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #localPanel .panel-loc {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            font-weight: 500;
        }

        #localPanel .panel-close {
            background: none;
            border: none;
            color: #00ff88;
            font-size: 1.6rem;
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
            transition: all 0.2s;
        }

        #localPanel .panel-close:hover {
            color: #ff2d2d;
            transform: scale(1.2);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(0, 255, 255, 0.15);
            font-size: 0.9rem;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 1px;
        }

        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #00ffff;
            font-size: 1rem;
        }

        .stat-value.warn { color: #ff8c00; }
        .stat-value.danger { color: #ff0033; }

        .emergency-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px solid rgba(255, 45, 45, 0.5);
        }

        .emergency-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #ff2d2d;
            margin-bottom: 12px;
        }

        .emergency-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 0.9rem;
            border-bottom: 1px dashed rgba(255, 45, 45, 0.15);
        }

        .emergency-item:last-child { border-bottom: none; }

        .emergency-item .number {
            font-family: 'Orbitron', sans-serif;
            color: #ff2d2d;
            font-weight: 700;
            text-decoration: none;
            padding: 4px 10px;
            border: 1px solid rgba(255, 45, 45, 0.4);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .emergency-item .number:hover {
            background: rgba(255, 45, 45, 0.15);
            box-shadow: 0 0 12px rgba(255, 45, 45, 0.6);
        }

        .legend {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 768px) {
            .logo { font-size: 2rem; letter-spacing: 4px; }
            .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
            .lang-switch { top: 15px; right: 15px; }
            .lang-switch button { padding: 6px 10px; font-size: 0.7rem; }
            .search-box { min-width: 100%; }
            .search-box input { padding: 14px 16px; font-size: 0.95rem; }
            .search-box button { padding: 0 18px; letter-spacing: 2px; font-size: 0.75rem; }
            .geo-button { padding: 14px 18px; font-size: 0.75rem; width: 100%; }
            .info-item { min-width: 140px; padding: 8px 16px; }
            .info-item .value { font-size: 1.2rem; }
            #globeViz { height: 55vh; }
            #localPanel {
                top: auto;
                bottom: 10px;
                right: 10px;
                left: 10px;
                width: auto;
                max-height: 50vh;
            }
        }

</head>

            <div id="emergencyList"></div>

    <div class="legend" translate="no">

            <div class="legend-dot" style="background:#ffe600; color:#ffe600;"></div>

                { name: { es: 'Emergencias', en: 'Emergency' }, number: '911' }
            ]
        };

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let currentLang = localStorage.getItem('sismonow_lang') || 'es';
        let ultimosTerremotos = [];
        let miUbicacion = null;

        // ============================================================
        // APLICAR IDIOMA
        // ============================================================
        function aplicarIdioma(lang) {
            currentLang = lang;
            localStorage.setItem('sismonow_lang', lang);
            const t = I18N[lang];

            document.documentElement.lang = lang;
            document.title = 'sismonow — ' + t.subtitle;

            document.getElementById('t-subtitle').textContent = t.subtitle;
            document.getElementById('t-quakeLabel').textContent = t.quakeLabel;
            document.getElementById('t-updateLabel').textContent = t.updateLabel;
            document.getElementById('t-locationLabel').textContent = t.locationLabel;
            document.getElementById('t-legendLow').textContent = t.legendLow;
            document.getElementById('t-legendMid').textContent = t.legendMid;
            document.getElementById('t-legendHigh').textContent = t.legendHigh;

            document.getElementById('t-panelTitle').textContent = t.panelTitle;
            document.getElementById('t-statNear').textContent = t.statNear;
            document.getElementById('t-statClosest').textContent = t.statClosest;
            document.getElementById('t-statStrongest').textContent = t.statStrongest;
            document.getElementById('t-emergencyTitle').textContent = t.emergencyTitle;

            const searchInput = document.getElementById('searchInput');
            searchInput.placeholder = t.searchPlaceholder;

            document.getElementById('btn-search').textContent = t.searchBtn;

            const geoBtn = document.getElementById('btn-geo');
            if (!geoBtn.disabled) {
                if (geoBtn.classList.contains('success')) {
                    geoBtn.textContent = t.geoBtnSuccess;
                } else {
                    geoBtn.textContent = t.geoBtn;
                }
            }

            const locEl = document.getElementById('activeLocation');
            if (locEl.dataset.translatable === 'true') {
                locEl.textContent = t.world;
            }

            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            if (ultimosTerremotos.length > 0) {
                dibujarPuntos(ultimosTerremotos);
            }

            if (miUbicacion) {
                actualizarPanelLocal();
            }
        }

        document.getElementById('btn-es').addEventListener('click', () => aplicarIdioma('es'));
        document.getElementById('btn-en').addEventListener('click', () => aplicarIdioma('en'));

        // ============================================================
        // SEGURIDAD
        // ============================================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // DISTANCIA (Haversine)
        // ============================================================
        function distanciaKm(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) ** 2 +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        // ============================================================
        // GLOBO
        // ============================================================
        const globeEl = document.getElementById('globeViz');

        const world = Globe()
            (globeEl)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('rgba(0,0,0,0)')
            .width(globeEl.clientWidth)
            .height(globeEl.clientHeight)
            .atmosphereColor('#00ffff')
            .atmosphereAltitude(0.18);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // ============================================================
        // TERREMOTOS
        // ============================================================
        const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';

        function dibujarPuntos(points) {
            const t = I18N[currentLang];
            world
                .pointsData(points)
                .pointLat('lat')
                .pointLng('lng')
                .pointColor('color')
                .pointRadius('size')
                .pointAltitude(0.02)
                .pointResolution(24)
                .pointLabel(d => '<b>' + escapeHTML(t.mag) + ' ' + escapeHTML(d.mag) + '</b><br/>' + escapeHTML(d.place));
        }

        function cargarTerremotos() {
            const t = I18N[currentLang];

            fetch(USGS_URL, { referrerPolicy: 'no-referrer' })
                .then(r => {
                    if (!r.ok) throw new Error('USGS ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (!data || !Array.isArray(data.features)) {
                        throw new Error('Formato inesperado');
                    }

                    const quakes = data.features;
                    const ahora = new Date().toLocaleTimeString(t.locale, {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    document.getElementById('quakeCount').textContent = quakes.length;
                    document.getElementById('lastUpdate').textContent = ahora;

                    ultimosTerremotos = quakes
                        .filter(q => q && q.geometry && Array.isArray(q.geometry.coordinates) && q.geometry.coordinates.length >= 2)
                        .map(q => {
                            const mag = (typeof q.properties?.mag === 'number') ? q.properties.mag : 0;
                            return {
                                lat: q.geometry.coordinates[1],
                                lng: q.geometry.coordinates[0],
                                mag: mag,
                                place: q.properties?.place || t.unknownPlace,
                                size: Math.max(0.25, mag * 0.25),
                                color: mag >= 5 ? '#ff0033'
                                     : mag >= 3 ? '#ff8c00'
                                     : '#ffe600'
                            };
                        });

                    dibujarPuntos(ultimosTerremotos);

                    if (miUbicacion) {
                        actualizarPanelLocal();
                    }
                })
                .catch(err => {
                    console.error('Error terremotos:', err);
                    document.getElementById('quakeCount').textContent = t.error;
                });
        }

        // ============================================================
        // BUSCADOR POR PAÍS
        // ============================================================
        function buscarPais() {
            const t = I18N[currentLang];
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;

            const query = rawQuery.replace(/[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ\s,\-\.]/g, '');
            if (query.length === 0 || query.length > 100) return;

            const url = 'https://nominatim.openstreetmap.org/search'
                + '?format=json&limit=1'
                + '&accept-language=' + currentLang
                + '&q=' + encodeURIComponent(query);

            const locEl = document.getElementById('activeLocation');
            locEl.dataset.translatable = 'false';
            locEl.textContent = t.searching;

            fetch(url, { referrerPolicy: 'no-referrer' })
                .then(r => {
                    if (!r.ok) throw new Error('Nominatim ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (!Array.isArray(data) || data.length === 0) {
                        locEl.textContent = t.notFound;
                        world.ringsData([]);
                        return;
                    }

                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);

                    if (isNaN(lat) || isNaN(lng)) {
                        locEl.textContent = t.error;
                        return;
                    }

                    volarA(lat, lng);

                    const nombreCorto = (data[0].display_name || '').split(',')[0].trim() || t.world;
                    locEl.textContent = nombreCorto;
                })
                .catch(err => {
                    console.error('Error búsqueda:', err);
                    locEl.textContent = t.error;
                });
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') buscarPais();
        });

        // ============================================================
        // VUELO + ANILLO
        // ============================================================
        function volarA(lat, lng) {
            world.controls().autoRotate = false;
            world.pointOfView({ lat: lat, lng: lng, altitude: 1.2 }, 2000);

            world
                .ringsData([{ lat: lat, lng: lng }])
                .ringLat('lat')
                .ringLng('lng')
                .ringColor(() => t2 => 'rgba(0, 255, 255, ' + (1 - t2) + ')')
                .ringMaxRadius(8)
                .ringPropagationSpeed(3)
                .ringRepeatPeriod(800);
        }

        // ============================================================
        // GEOLOCALIZACIÓN
        // ============================================================
        function usarMiUbicacion() {
            const t = I18N[currentLang];
            const geoBtn = document.getElementById('btn-geo');
            const locEl = document.getElementById('activeLocation');

            if (!navigator.geolocation) {
                locEl.dataset.translatable = 'false';
                locEl.textContent = t.geoUnsupported;
                return;
            }

            geoBtn.disabled = true;
            geoBtn.textContent = t.geoBtnLoading;
            geoBtn.classList.remove('success');

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;

                    volarA(lat, lng);
                    miUbicacion = { lat: lat, lng: lng, country: '' };

                    // Mostrar panel inmediatamente con datos básicos
                    const locElInner = document.getElementById('activeLocation');
                    locElInner.dataset.translatable = 'false';
                    locElInner.textContent = lat.toFixed(2) + ', ' + lng.toFixed(2);
                    document.getElementById('panelLoc').textContent = lat.toFixed(2) + ', ' + lng.toFixed(2);
                    actualizarPanelLocal();
                    abrirPanel();

                    // Reverse geocoding (opcional, para mejorar el nombre)
                    const url = 'https://nominatim.openstreetmap.org/reverse'
                        + '?format=json&limit=1'
                        + '&accept-language=' + currentLang
                        + '&lat=' + lat + '&lon=' + lng;

                    fetch(url, { referrerPolicy: 'no-referrer' })
                        .then(r => r.json())
                        .then(data => {
                            const lugar = data?.address?.city
                                || data?.address?.town
                                || data?.address?.state
                                || data?.address?.country
                                || (lat.toFixed(2) + ', ' + lng.toFixed(2));
                            const pais = data?.address?.country || '';
                            miUbicacion.country = pais;
                            locElInner.textContent = lugar;
                            actualizarPanelLocal();
                        })
                        .catch(() => {
                            // Ya mostramos coords antes, no hace falta más
                        })
                        .finally(() => {
                            geoBtn.disabled = false;
                            geoBtn.classList.add('success');
                            geoBtn.textContent = t.geoBtnSuccess;
                        });
                },
                (err) => {
                    console.error('Error geolocalización:', err);
                    locEl.dataset.translatable = 'false';
                    locEl.textContent = t.geoDenied;
                    geoBtn.disabled = false;
                    geoBtn.textContent = t.geoBtn;
                },
                { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
            );
        }

        // ============================================================
        // PANEL LOCAL
        // ============================================================
        function abrirPanel() {
            document.getElementById('localPanel').classList.add('visible');
        }

        function cerrarPanel() {
            document.getElementById('localPanel').classList.remove('visible');
        }

        function actualizarPanelLocal() {
            if (!miUbicacion) return;
            const t = I18N[currentLang];
            const { lat, lng } = miUbicacion;

            const locText = document.getElementById('activeLocation').textContent || '—';
            document.getElementById('panelLoc').textContent = locText;

            // Filtrar sismos en 500 km
            const cercanos = ultimosTerremotos
                .map(q => ({ ...q, dist: distanciaKm(lat, lng, q.lat, q.lng) }))
                .filter(q => q.dist <= 500)
                .sort((a, b) => a.dist - b.dist);

            document.getElementById('statNear').textContent = cercanos.length;

            if (cercanos.length === 0) {
                document.getElementById('statClosest').textContent = t.none;
                document.getElementById('statClosest').className = 'stat-value';
                document.getElementById('statStrongest').textContent = t.none;
                document.getElementById('statStrongest').className = 'stat-value';
            } else {
                const masCercano = cercanos[0];
                document.getElementById('statClosest').textContent =
                    Math.round(masCercano.dist) + ' ' + t.km + ' · M' + masCercano.mag.toFixed(1);
                document.getElementById('statClosest').className = 'stat-value' +
                    (masCercano.mag >= 5 ? ' danger' : masCercano.mag >= 3 ? ' warn' : '');

                const masFuerte = cercanos.reduce((max, q) => q.mag > max.mag ? q : max, cercanos[0]);
                document.getElementById('statStrongest').textContent = 'M' + masFuerte.mag.toFixed(1);
                document.getElementById('statStrongest').className = 'stat-value' +
                    (masFuerte.mag >= 5 ? ' danger' : masFuerte.mag >= 3 ? ' warn' : '');
            }

            // Números de emergencia
            const pais = miUbicacion.country;
            const emergencySection = document.getElementById('emergencySection');
            const emergencyList = document.getElementById('emergencyList');

            if (pais && EMERGENCY[pais]) {
                emergencyList.innerHTML = EMERGENCY[pais].map(e =>
                    '<div class="emergency-item">' +
                    '<span>' + escapeHTML(e.name[currentLang]) + '</span>' +
                    '<a class="number" href="tel:' + escapeHTML(e.number) + '">' + escapeHTML(e.number) + '</a>' +
                    '</div>'
                ).join('');
                emergencySection.style.display = 'block';
            } else {
                emergencySection.style.display = 'none';
            }
        }

        window.addEventListener('resize', () => {
            world.width(globeEl.clientWidth).height(globeEl.clientHeight);
        });

        // ============================================================
        // ARRANQUE
        // ============================================================
        aplicarIdioma(currentLang);
        document.getElementById('activeLocation').dataset.translatable = 'true';

        cargarTerremotos();
        setInterval(cargarTerremotos, 300000);
    </script>
</body>
</html>
