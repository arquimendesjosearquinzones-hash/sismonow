<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://unpkg.com data:; connect-src https://earthquake.usgs.gov https://nominatim.openstreetmap.org;">

    <title>sismonow — Terremotos en tiempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            pointer-events: none;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 15%, rgba(176, 38, 255, 0.15), transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 255, 0.10), transparent 40%);
            z-index: 0;
            pointer-events: none;
        }

        header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 30px 20px 10px;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.2rem;
            letter-spacing: 8px;
            background: linear-gradient(90deg, #00ffff, #b026ff, #ff00ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 255, 0.5);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 40px rgba(176, 38, 255, 0.9)); }
        }

        .subtitle {
            font-size: 1rem;
            letter-spacing: 4px;
            color: #00ffff;
            text-transform: uppercase;
            margin-top: 6px;
            opacity: 0.8;
        }

        .lang-switch {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 20;
            display: flex;
            gap: 8px;
        }

        .lang-switch button {
            padding: 8px 16px;
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 6px;
            background: rgba(0, 10, 20, 0.7);
            color: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-switch button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }

        .lang-switch button.active {
            background: #00ffff;
            color: #000;
        }

        .search-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            margin: 30px auto 20px;
            max-width: 700px;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            width: 100%;
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px;
            background: rgba(0, 10, 20, 0.7);
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.05);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: #00ffff;
            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .search-box input {
            flex: 1;
            padding: 18px 24px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 1px;
        }

        .search-box input::placeholder {
            color: rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .search-box button {
            padding: 0 30px;
            border: none;
            background: linear-gradient(90deg, #00ffff, #b026ff);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .search-box button:hover {
            background: linear-gradient(90deg, #b026ff, #ff00ff);
            color: #fff;
            letter-spacing: 4px;
        }

        .info-bar {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 0 20px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 24px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(0, 10, 20, 0.5);
            backdrop-filter: blur(8px);
            min-width: 180px;
        }

        .info-item .label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: rgba(0, 255, 255, 0.7);
            text-transform: uppercase;
        }

        .info-item .value {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            margin-top: 4px;
        }

        #globeViz {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 65vh;
            margin: 0 auto;
        }

        .legend {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px;
            margin-top: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.8);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 768px) {
            .logo { font-size: 2rem; letter-spacing: 4px; }
            .subtitle { font-size: 0.8rem; letter-spacing: 2px; }
            .lang-switch { top: 15px; right: 15px; }
            .lang-switch button { padding: 6px 10px; font-size: 0.7rem; }
            .search-box input { padding: 14px 16px; font-size: 0.95rem; }
            .search-box button { padding: 0 18px; letter-spacing: 2px; font-size: 0.75rem; }
            .info-item { min-width: 140px; padding: 8px 16px; }
            .info-item .value { font-size: 1.2rem; }
            #globeViz { height: 55vh; }
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button id="btn-es" onclick="setLang('es')" class="active">ES</button>
        <button id="btn-en" onclick="setLang('en')">EN</button>
    </div>

    <header>
        <div class="logo">SISMONOW</div>
        <div class="subtitle" data-i18n="subtitle">Monitor Global de Terremotos · En Vivo</div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="BUSCAR PAÍS · EJ: VENEZUELA" maxlength="100" autocomplete="off" />
            <button onclick="buscarPais()" data-i18n="searchBtn">BUSCAR</button>
        </div>
    </div>

    <div class="info-bar">
        <div class="info-item">
            <span class="label" data-i18n="quakeLabel">Terremotos 24h</span>
            <span class="value" id="quakeCount">—</span>
        </div>
        <div class="info-item">
            <span class="label" data-i18n="updateLabel">Última actualización</span>
            <span class="value" id="lastUpdate">—</span>
        </div>
        <div class="info-item">
            <span class="label" data-i18n="locationLabel">Ubicación activa</span>
            <span class="value" id="activeLocation" style="font-size:1rem;" data-i18n="world">Mundo</span>
        </div>
    </div>

    <div id="globeViz"></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-dot" style="background:#ffe600; color:#ffe600;"></div>
            <span data-i18n="legendLow">Magnitud &lt; 3.0</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#ff8c00; color:#ff8c00;"></div>
            <span data-i18n="legendMid">Magnitud 3.0 – 4.9</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background:#ff0033; color:#ff0033;"></div>
            <span data-i18n="legendHigh">Magnitud ≥ 5.0</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    <script>
        // ============================================================
        // SISTEMA DE TRADUCCIÓN (i18n) — REAL, SIN GOOGLE TRANSLATE
        // ============================================================
        const translations = {
            es: {
                subtitle: 'Monitor Global de Terremotos · En Vivo',
                searchPlaceholder: 'BUSCAR PAÍS · EJ: VENEZUELA',
                searchBtn: 'BUSCAR',
                quakeLabel: 'Terremotos 24h',
                updateLabel: 'Última actualización',
                locationLabel: 'Ubicación activa',
                world: 'Mundo',
                searching: 'Buscando...',
                notFound: 'No encontrado',
                error: 'Error',
                legendLow: 'Magnitud < 3.0',
                legendMid: 'Magnitud 3.0 – 4.9',
                legendHigh: 'Magnitud ≥ 5.0'
            },
            en: {
                subtitle: 'Global Earthquake Monitor · Live',
                searchPlaceholder: 'SEARCH COUNTRY · EX: VENEZUELA',
                searchBtn: 'SEARCH',
                quakeLabel: 'Earthquakes 24h',
                updateLabel: 'Last update',
                locationLabel: 'Active location',
                world: 'World',
                searching: 'Searching...',
                notFound: 'Not found',
                error: 'Error',
                legendLow: 'Magnitude < 3.0',
                legendMid: 'Magnitude 3.0 – 4.9',
                legendHigh: 'Magnitude ≥ 5.0'
            }
        };

        let currentLang = 'es';

        function setLang(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });
            document.getElementById('btn-es').classList.toggle('active', lang === 'es');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.documentElement.lang = lang;
        }

        // ============================================================
        // UTILIDADES DE SEGURIDAD
        // ============================================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        // INICIALIZAR GLOBO
        // ============================================================
        const globeEl = document.getElementById('globeViz');

        const world = Globe()
            (globeEl)
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('rgba(0,0,0,0)')
            .width(globeEl.clientWidth)
            .height(globeEl.clientHeight)
            .atmosphereColor('#00ffff')
            .atmosphereAltitude(0.18);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson';

        // ============================================================
        // CARGAR TERREMOTOS
        // ============================================================
        function cargarTerremotos() {
            fetch(USGS_URL, { referrerPolicy: 'no-referrer' })
                .then(r => {
                    if (!r.ok) throw new Error('USGS respondió ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (!data || !Array.isArray(data.features)) {
                        throw new Error('Formato inesperado');
                    }

                    const quakes = data.features;
                    const ahora = new Date().toLocaleTimeString(
                        currentLang === 'es' ? 'es-ES' : 'en-US',
                        { hour: '2-digit', minute: '2-digit' }
                    );

                    document.getElementById('quakeCount').innerText = quakes.length;
                    document.getElementById('lastUpdate').innerText = ahora;

                    const points = quakes
                        .filter(q => q && q.geometry && Array.isArray(q.geometry.coordinates) && q.geometry.coordinates.length >= 2)
                        .map(q => {
                            const mag = (typeof q.properties?.mag === 'number') ? q.properties.mag : 0;
                            return {
                                lat: q.geometry.coordinates[1],
                                lng: q.geometry.coordinates[0],
                                mag: mag,
                                place: q.properties?.place || 'Ubicación desconocida',
                                size: Math.max(0.25, mag * 0.25),
                                color: mag >= 5 ? '#ff0033'
                                     : mag >= 3 ? '#ff8c00'
                                     : '#ffe600'
                            };
                        });

                    world
                        .pointsData(points)
                        .pointLat('lat')
                        .pointLng('lng')
                        .pointColor('color')
                        .pointRadius('size')
                        .pointAltitude(0.02)
                        .pointResolution(24)
                        .pointLabel(d => '<b>Mag ' + escapeHTML(d.mag) + '</b><br/>' + escapeHTML(d.place));
                })
                .catch(err => {
                    console.error('Error terremotos:', err);
                    document.getElementById('quakeCount').innerText = translations[currentLang].error;
                });
        }

        cargarTerremotos();
        setInterval(cargarTerremotos, 300000);

        // ============================================================
        // BUSCADOR
        // ============================================================
        function buscarPais() {
            const rawQuery = document.getElementById('searchInput').value.trim();
            if (!rawQuery) return;

            const query = rawQuery.replace(/[^a-zA-Z0-9áéíóúñÁÉÍÓÚÑ\s,\-\.]/g, '');
            if (query.length === 0 || query.length > 100) return;

            const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);

            document.getElementById('activeLocation').innerText = translations[currentLang].searching;

            fetch(url, { referrerPolicy: 'no-referrer' })
                .then(r => {
                    if (!r.ok) throw new Error('Nominatim respondió ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (!Array.isArray(data) || data.length === 0) {
                        document.getElementById('activeLocation').innerText = translations[currentLang].notFound;
                        world.ringsData([]);
                        return;
                    }

                    const lat = parseFloat(data[0].lat);
                    const lng = parseFloat(data[0].lon);

                    if (isNaN(lat) || isNaN(lng)) {
                        document.getElementById('activeLocation').innerText = translations[currentLang].error;
                        return;
                    }

                    world.controls().autoRotate = false;
                    world.pointOfView({ lat: lat, lng: lng, altitude: 1.2 }, 2000);

                    world
                        .ringsData([{ lat: lat, lng: lng }])
                        .ringLat('lat')
                        .ringLng('lng')
                        .ringColor(() => t => 'rgba(0, 255, 255, ' + (1 - t) + ')')
                        .ringMaxRadius(8)
                        .ringPropagationSpeed(3)
                        .ringRepeatPeriod(800);

                    const nombreCorto = (data[0].display_name || '').split(',')[0] || translations[currentLang].world;
                    document.getElementById('activeLocation').innerText = nombreCorto;
                })
                .catch(err => {
                    console.error('Error búsqueda:', err);
                    document.getElementById('activeLocation').innerText = translations[currentLang].error;
                });
        }

        document.getElementById('searchInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') buscarPais();
        });

        window.addEventListener('resize', () => {
            world.width(globeEl.clientWidth).height(globeEl.clientHeight);
        });
    </script>
</body>
</html>
